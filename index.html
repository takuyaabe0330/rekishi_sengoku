<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中学歴史戦国 5択クイズ</title>
  <style>
    :root {
      --primary-color: #2196F3;
      --hover-color: #1976D2;
      --bg-color: #f4f7f6;
      --text-color: #333;
      --card-bg: #fff;
    }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    #app {
      background: var(--card-bg);
      width: 100%;
      max-width: 600px;
      margin: 20px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      box-sizing: border-box;
      position: relative;
      z-index: 10;
    }
    h1, h2 { text-align: center; }
    .hidden { display: none !important; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      background-color: var(--card-bg);
      border: 2px solid var(--primary-color);
      color: var(--primary-color);
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }
    .btn:hover { background-color: var(--primary-color); color: #fff; }
    .btn-primary {
      background-color: var(--primary-color);
      color: #fff;
      text-align: center;
      font-weight: bold;
      border: none;
    }
    .btn-primary:hover { background-color: var(--hover-color); }
    .btn:disabled { cursor: not-allowed; opacity: 0.7; }
    .correct-btn { background-color: #4CAF50 !important; color: white !important; border-color: #4CAF50 !important; }
    .wrong-btn { background-color: #f44336 !important; color: white !important; border-color: #f44336 !important; }
    #progress { text-align: center; font-weight: bold; margin-bottom: 20px; color: #666; }
    #question-text { font-size: 18px; line-height: 1.6; margin-bottom: 25px; }
    #explanation-box {
      margin-top: 20px;
      padding: 15px;
      background-color: #e3f2fd;
      border-left: 5px solid var(--primary-color);
      border-radius: 4px;
    }
    .score-display { font-size: 24px; text-align: center; margin: 20px 0; font-weight: bold; }
    .high-score { text-align: center; font-size: 14px; color: #777; margin-top: 10px; }

    /* 満点演出用のスタイル */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }
    .perfect-banner {
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #fff;
      text-align: center;
      padding: 16px 20px;
      border-radius: 10px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      box-shadow: 0 4px 15px rgba(255, 140, 0, 0.4);
      margin-bottom: 20px;
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, pulse 1.8s infinite;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }
    @keyframes popIn {
      0% { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
  </style>
</head>

  <!-- 紙吹雪描画用キャンバス -->

    <div id="start-screen">

    </div>

    <div id="quiz-screen" class="hidden">

      <div id="question-text"></div>
      <div id="options-container"></div>

      <div id="explanation-box" class="hidden">

        <p id="explanation-text"></p>
        <button class="btn btn-primary" onclick="nextQuestion()" style="margin-top: 15px;">次の問題へ</button>
      </div>
    </div>

    <div id="result-screen" class="hidden">
      <!-- 満点時のみ表示される演出バナー -->
      <div id="perfect-banner" class="perfect-banner hidden">
        ⚔️ 天下統一！満点達成！ 🏯

      <button class="btn btn-primary" onclick="resetQuiz()" style="margin-top: 30px;">トップに戻る</button>

    const QUESTION_COUNT = 10;
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let isAnswered = false;

    // 紙吹雪アニメーション管理
    let confettiAnimationId = null;
    let particles = [];

    window.onload = () => {
      const storageKey = 'quizHighScore_中学歴史戦国 5択クイズ';
      const highScore = localStorage.getItem(storageKey) || 0;
      document.getElementById('high-score-display').innerText = `過去の最高得点: ${highScore}点`;
    };

    function startQuiz() {
      stopConfetti();
      currentQuestions = [...allQuizData].sort(() => 0.5 - Math.random()).slice(0, QUESTION_COUNT);
      currentQuestionIndex = 0;
      score = 0;

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');

      showQuestion();
    }

    function showQuestion() {
      isAnswered = false;
      document.getElementById('explanation-box').classList.add('hidden');

      const q = currentQuestions[currentQuestionIndex];
      document.getElementById('progress').innerText = `問題 ${currentQuestionIndex + 1} / ${currentQuestions.length} （${q.unit}）`;
      document.getElementById('question-text').innerText = q.question;

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      q.options.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = option;
        btn.onclick = () => checkAnswer(index, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedIndex, selectedBtn) {
      if (isAnswered) return;
      isAnswered = true;

      const q = currentQuestions[currentQuestionIndex];
      const buttons = document.getElementById('options-container').querySelectorAll('button');

      buttons.forEach((btn, index) => {
        btn.disabled = true;
        if (index === q.answerIndex) {
          btn.classList.add('correct-btn');
        } else if (index === selectedIndex) {
          btn.classList.add('wrong-btn');
        }
      });

      const title = document.getElementById('result-title');
      if (selectedIndex === q.answerIndex) {
        title.innerText = "⭕ 正解！";
        title.style.color = "#4CAF50";
        score++;
      } else {
        title.innerText = "❌ 不正解...";
        title.style.color = "#f44336";
      }

      document.getElementById('explanation-text').innerText = q.explanation;
      document.getElementById('explanation-box').classList.remove('hidden');
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < currentQuestions.length) {
        showQuestion();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');

      const isPerfect = score === currentQuestions.length;
      const perfectBanner = document.getElementById('perfect-banner');

      if (isPerfect) {
        perfectBanner.classList.remove('hidden');
        startConfetti();
        document.getElementById('final-score').innerHTML = `<span style="color: #ff9800; font-size: 32px;">🌟 10問中 10問 全問正解！ 🌟</span>`;
      } else {
        perfectBanner.classList.add('hidden');
        document.getElementById('final-score').innerText = `${currentQuestions.length}問中 ${score}問正解！`;
      }

      const storageKey = 'quizHighScore_中学歴史戦国 5択クイズ';
      const currentHighScore = parseInt(localStorage.getItem(storageKey) || 0);
      const msgElement = document.getElementById('new-high-score-msg');

      if (score > currentHighScore) {
        localStorage.setItem(storageKey, score);
        msgElement.innerText = "🎉 最高得点を更新しました！";
        msgElement.classList.remove('hidden');
      } else {
        msgElement.classList.add('hidden');
      }
    }

    function resetQuiz() {
      stopConfetti();
      const storageKey = 'quizHighScore_中学歴史戦国 5択クイズ';
      const highScore = localStorage.getItem(storageKey) || 0;
      document.getElementById('high-score-display').innerText = `過去の最高得点: ${highScore}点`;

      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    }

    /* --- 紙吹雪（コンフェッティ）エンジン --- */
    function startConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      canvas.classList.remove('hidden');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const ctx = canvas.getContext('2d');

      const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4caf50', '#8bc34a', '#cddc39', '#ffeb3b', '#ffc107', '#ff9800', '#ff5722'];
      particles = [];
      const particleCount = 130;

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          r: Math.random() * 6 + 4,
          d: Math.random() * particleCount,
          color: colors[Math.floor(Math.random() * colors.length)],
          tilt: Math.floor(Math.random() * 10) - 10,
          tiltAngleIncremental: (Math.random() * 0.07) + 0.05,
          tiltAngle: 0
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          ctx.beginPath();
          ctx.lineWidth = p.r / 1.5;
          ctx.strokeStyle = p.color;
          ctx.moveTo(p.x + p.tilt + (p.r / 4), p.y);
          ctx.lineTo(p.x + p.tilt, p.y + p.tilt + (p.r / 4));
          ctx.stroke();
        }
        update();
      }

      function update() {
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.tiltAngle += p.tiltAngleIncremental;
          p.y += (Math.cos(p.d) + 3 + p.r / 2) / 1.8;
          p.x += Math.sin(0.01 * p.d);
          p.tilt = Math.sin(p.tiltAngle - (i / 3)) * 15;

          if (p.y > canvas.height) {
            p.x = Math.random() * canvas.width;
            p.y = -20;
          }
        }
      }

      (function animloop() {
        draw();
        confettiAnimationId = requestAnimationFrame(animloop);
      })();
    }

    function stopConfetti() {
      if (confettiAnimationId) {
        cancelAnimationFrame(confettiAnimationId);
        confettiAnimationId = null;
      }
      const canvas = document.getElementById('confetti-canvas');
      if (canvas) {
        canvas.classList.add('hidden');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      particles = [];
    }

    window.addEventListener('resize', () => {
      const canvas = document.getElementById('confetti-canvas');
      if (canvas && !canvas.classList.contains('hidden')) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
    });
  </script>
